<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with slight rounding -->
  <rect width="512" height="512" rx="128" fill="#050B18" />
  
  <!-- Smartphone Outline -->
  <rect x="136" y="64" width="240" height="384" rx="36" fill="none" stroke="#FFFFFF" stroke-width="20" />
  
  <!-- Screen speaker slot -->
  <line x1="224" y1="96" x2="288" y2="96" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  
  <!-- Glowing Wrench -->
  <!-- Wrench Handle -->
  <path d="M226 316 L286 256" stroke="#3B82F6" stroke-width="28" stroke-linecap="round" />
  
  <!-- Wrench bottom jaw (closed circle or ring) -->
  <circle cx="206" cy="336" r="30" fill="none" stroke="#3B82F6" stroke-width="20" />
  
  <!-- Wrench top jaw (open C-shape) -->
  <path d="M272 242 C262 222 280 186 308 186 C336 186 360 210 360 238 C360 266 324 284 304 274" fill="none" stroke="#3B82F6" stroke-width="20" stroke-linecap="round" />
  
  <!-- Internal hex cutout in bottom jaw -->
  <polygon points="206,326 215,331 215,341 206,346 197,341 197,331" fill="#050B18" />
  
  <!-- Lightning bolt/power/speed spark -->
  <path d="M370 110 L350 150 L380 150 L360 190" fill="none" stroke="#3B82F6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
